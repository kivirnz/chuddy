[project]
name = "chuddy"
version = "2.0.0"
requires-python = ">=3.12"
description = "Telegram media download bot - simple, fast, single-process"
dependencies = [
    "pyrofork>=2.3.56",
    "tgcrypto-pyrofork>=1.2.7",
    "pyyaml>=6.0.2",
    "pydantic>=2.10.6",
    "pydantic-settings>=2.7.1",
    "aiosqlite>=0.20.0",
    "yt-dlp>=2024.5.23.232707.dev0",
    "pillow>=11.1.0",
    "aiohttp>=3.11.11",
    "uvloop>=0.21.0 ; sys_platform == 'linux'",
]

[project.scripts]
chuddy = "chuddy.__main__:main"

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py312"

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.ruff.format]
indent-style = "space"
quote-style = "single"
line-ending = "lf"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
